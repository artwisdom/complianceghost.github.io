<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Compliance Ghost</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
            background:#1a2744;color:#fff;min-height:100vh;
            display:flex;align-items:center;justify-content:center;
            text-align:center;padding:24px;line-height:1.6;
        }
        .wrap{max-width:520px}
        .logo{height:96px;width:auto;border-radius:12px;margin-bottom:28px}
        .code{font-size:5rem;font-weight:700;color:#4ecdc4;line-height:1;letter-spacing:-.02em}
        h1{font-size:1.5rem;margin:12px 0 10px;font-weight:700}
        p{color:rgba(255,255,255,.75);font-size:1rem;margin-bottom:28px}
        .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:8px;font-weight:600;font-size:.95rem;text-decoration:none;transition:transform .2s,background .2s}
        .btn-primary{background:#2ecc71;color:#fff}
        .btn-primary:hover{background:#3dd87a;transform:translateY(-2px)}
        .btn-ghost{background:transparent;color:#4ecdc4;border:1px solid rgba(78,205,196,.4)}
        .btn-ghost:hover{border-color:#4ecdc4;transform:translateY(-2px)}
        @media (prefers-reduced-motion:reduce){.btn:hover{transform:none}}
    </style>
</head>
<body>
    <main class="wrap">
        <a href="/"><img src="/logo.png" alt="Compliance Ghost" class="logo"></a>
        <div class="code">404</div>
        <h1>This page vanished like a ghost.</h1>
        <p>The page you're looking for doesn't exist or has moved. Let's get you back to protecting your Texas business.</p>
        <div class="actions">
            <a href="/" class="btn btn-primary">Back to Home</a>
            <a href="/checklist/" class="btn btn-ghost">Free Compliance Gap Assessment</a>
        </div>
    </main>
</body>
</html>
